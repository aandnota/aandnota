<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Helmet One</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/helmet.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  </head>
  <body>

    <model-viewer id="oldjim" alt="mantest" src="../../models/oldjimcornerfigure.glb" ar ar-scale="fixed" autoplay shadow-intensity="1" camera-controls touch-action="pan-y"  xr-environment environment-image="../../models/hdr/HdrSkyEvening002_HDR_16K.jpg" skybox-height="1.5m">
    </model-viewer>   

    <script>
      (() => {
        const modelViewer = document.querySelector('#oldjim');
        const time = performance.now();
      
        const animate = (now) => {
          modelViewer.exposure = oscillate(0, 2, 4000, now - time);
          requestAnimationFrame(animate);
        };
      
        animate();
      })();
      </script>
  
  </body>
</html>
