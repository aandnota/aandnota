name = "alexmyers-chat"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
SITE_URL = "https://www.alexmyers.info"
MODEL = "claude-sonnet-5-5"     # or "claude-haiku-5-5": cheaper and faster, a bit less thoughtful
MAX_TOKENS = "700"
# ALLOWED_ORIGINS = "https://www.alexmyers.info,https://alexmyers.info,http://127.0.0.1:5500"

# The API key is NOT kept here (this folder is in a public repo). Set it with:
#   npx wrangler secret put ANTHROPIC_API_KEY

# At most 15 messages per minute from one visitor. Delete these lines to turn it off.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 15, period = 60 }
